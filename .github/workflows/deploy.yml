name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN permissions are read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already in flight should finish rather than be cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Checked before the build, not after. Vite substitutes these at compile
      # time, so once the bundle exists there is nothing left to grep for —
      # a missing value silently becomes `undefined` and every visitor gets the
      # "not configured" screen.
      - name: Check Supabase config is present
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          [ -z "$URL" ] && { echo "::error::VITE_SUPABASE_URL is not set"; missing=1; }
          [ -z "$KEY" ] && { echo "::error::VITE_SUPABASE_ANON_KEY is not set"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Build
        env:
          # Public values, not secrets — the anon key is designed to ship in
          # the bundle and everything behind it is protected by RLS. Repo
          # *variables* are the honest home for them; secrets also work.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
